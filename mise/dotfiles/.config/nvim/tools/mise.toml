# Nixを使わないSSH先向け。手元のNix環境には適用しない。
# ~/.config/mise/conf.d/nvim.toml から参照して使う（docs/nvim-remote-dev.md）。
[settings]
exec_auto_install = false
not_found_auto_install = false
idiomatic_version_file_enable_tools = ["node", "ruby"]

[tools]
node = "24.22.2"
# go backendのツール導入に必要。プロジェクト固有のGoはそちらで宣言する。
go = "1.26.0"
"npm:basedpyright" = "1.31.7"
"npm:@tailwindcss/language-server" = "0.14.29"
"npm:typescript" = "5.9.3"
"npm:typescript-language-server" = "5.1.3"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:yaml-language-server" = "1.19.2"
"npm:prettier" = "3.6.2"
"aqua:biomejs/biome" = "2.4.6"
"aqua:astral-sh/ruff" = "0.15.5"
"aqua:JohnnyMorganz/StyLua" = "2.3.1"
"aqua:LuaLS/lua-language-server" = "3.17.0"
"aqua:rust-lang/rust-analyzer" = "2026-11-02"
"aqua:BurntSushi/ripgrep" = "15.1.0"
"aqua:sharkdp/fd" = "10.3.0"
"aqua:tree-sitter/tree-sitter" = "0.27.2"
"aqua:mvdan/gofumpt" = "0.10.0"
"go:golang.org/x/tools/gopls" = "0.23.0"
"go:golang.org/x/tools/cmd/goimports" = "0.47.1-0.20260707181000-a299dadba899"
