# herdr の設定（全項目は `herdr --default-config`、検証は `herdr config check`）。
# rio の中で動かし、分割・タブ・ワークスペース・セッション永続化を任せる。
# キー割り当ては wezterm/keybinds.lua の LEADER 操作に揃えてある。
#
# herdr は設定画面や onboarding でこのファイルを書き戻すため、~/.config/herdr へは
# ディレクトリごとではなくファイル単位で symlink している（mise/mise.unix.toml）。

# 初回の onboarding はこのファイルへ書き込み、integration 設定画面を開く。
# integration は ~/.claude/settings.json（repo への symlink）や ~/.codex を書き換えるので、
# 試用中は入れない。
onboarding = false

[keys]
# wezterm の leader と同じ。nvim 側の回避（nvim/lua/plugins/snacks.lua の <a-q>）もそのまま効く。
prefix = "ctrl+q"

focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
zoom = "prefix+z"
close_pane = "prefix+x"
resize_mode = "prefix+r"
# wezterm と同じく / で左右、- で上下に割る。
split_vertical = "prefix+/"
split_horizontal = "prefix+minus"
# wezterm の PaneSelect（LEADER Space）と同じく、一覧からペインを選んで飛ぶ。
goto = "prefix+space"

# prefix+c は下の copy-last-output に使うので、wezterm の CTRL+SHIFT t に寄せて t にする。
# rio の CTRL+SHIFT t / CTRL+SHIFT w / CTRL+数字 は prefix+t / prefix+shift+x（close_tab 既定）/
# prefix+数字（switch_tab 既定）を送っている（rio/config.toml）。prefix・new_tab・close_tab・
# switch_tab を変えるときは rio 側も揃えること。
new_tab = "prefix+t"

workspace_picker = "prefix+w"
new_workspace = "prefix+shift+w"
# 既定の rename_workspace (prefix+shift+w) を new_workspace に譲ったので付け替える。
rename_workspace = "prefix+shift+e"
previous_workspace = "prefix+["
next_workspace = "prefix+]"

# 既定の copy_mode (prefix+[) は previous_workspace に譲る。split_vertical を / に
# 移して空いた v と、wezterm の ActivateCopyMode と同じ ctrl+shift+x に割り当てる。
copy_mode = ["prefix+v", "ctrl+shift+x"]

# 直前のコマンドの出力をコピーする（wezterm の LEADER c）。
[[keys.command]]
key = "prefix+c"
type = "shell"
command = "~/.config/herdr/scripts/copy-last-output.sh"
description = "copy last command output"

# ghq のリポジトリを選んで workspace として開く（wezterm の LEADER g）。
# 既定の goto (prefix+g) は上で prefix+space に移してある。
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "~/.config/herdr/scripts/ghq-workspace.sh"
description = "open ghq repository as workspace"
width = "80%"
height = "80%"

[ui.toast]
# wezterm の bell.lua（非フォーカスのペインで鳴ったらトースト）の代わり。
delivery = "system"

[ui]
status_indicators = "symbols"
