#:schema https://developers.openai.com/codex/config-schema.json
model_provider = "mistral"
model = "mistral-large-4"
model_reasoning_effort = "high"

# 起動時のモデル案内と、その表示回数の書き戻しを無効にする。
tui.show_tooltips = false

# Mistral の Responses API はステートレスで、Codex が毎回履歴を送る形と合う。
# API キーは zsh の codex 関数が起動時に 1Password から取得して渡す。
model_providers.mistral.name = "Mistral"
model_providers.mistral.base_url = "https://api.mistral.ai/v1"
model_providers.mistral.env_key = "MISTRAL_API_KEY"
model_providers.mistral.wire_api = "responses"
