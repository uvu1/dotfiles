#:schema https://developers.openai.com/codex/config-schema.json
model = "gpt-5.6-sol"
model_reasoning_effort = "xhigh"

# nest した値は dotted key で書くこと(理由は AGENTS.md)。
# 作業場所と残量を確認しやすい順に表示する。
tui.status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-remaining",
  "five-hour-limit",
]
tui.status_line_use_colors = true
