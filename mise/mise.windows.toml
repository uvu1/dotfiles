# Windowsはsymlinkが使えずcopy配布のため、dotfiles/mise/config.windows.tomlはapply後にしか更新されない。
[dotfiles]
"~/.config/nvim" = { source = "dotfiles/.config/nvim", mode = "copy" }
"~/.config/mise/config.toml" = { source = "dotfiles/mise/config.windows.toml", mode = "copy" }
# rio は %USERPROFILE%\AppData\Local\rio を読む。config.toml の [platform.windows] が
# 背景画像をこの配置先の絶対パスで参照している。
"~/AppData/Local/rio/config.toml" = { source = "dotfiles/.config/rio/config.toml", mode = "copy" }
"~/AppData/Local/rio/background.jpg" = { source = "dotfiles/.config/rio/background.jpg", mode = "copy" }
"~/.config/starship.toml" = { source = "dotfiles/.config/starship.toml", mode = "copy" }
"~/Documents/PowerShell" = { source = "dotfiles/Documents/PowerShell", mode = "copy" }
