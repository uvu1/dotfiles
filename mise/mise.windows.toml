# GUIアプリ、Git、mise、PowerShell、WezTermはWinGet Configurationで導入する。
# ここではbaseのcore CLIにWindows用CLIと全Windows dotfilesを追加する。
[tool_alias]
eza = "github:eza-community/eza"

[tools]
bat = "latest"
eza = { version = "latest", asset_pattern = "eza.exe_x86_64-pc-windows-gnu.zip" }
gh = "latest"
ghq = "latest"
kubectl = "latest"
starship = "latest"

[dotfiles]
"~/.config/nvim" = { source = "dotfiles/.config/nvim", mode = "copy" }
"~/.config/mise/config.toml" = { source = "dotfiles/mise/config.windows.toml", mode = "copy" }
"~/.config/wezterm" = { source = "dotfiles/.config/wezterm", mode = "copy" }
"~/.config/starship.toml" = { source = "dotfiles/.config/starship.toml", mode = "copy" }
"~/Documents/PowerShell" = { source = "dotfiles/Documents/PowerShell", mode = "copy" }
